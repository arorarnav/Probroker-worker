name: Process Reports

on:
  schedule:
    - cron: "*/10 * * * *"   # checks every 10 minutes for anything to process
  workflow_dispatch:          # still lets you trigger it manually to test, any time

# Prevents a second run from starting while an earlier one is still working
# through reports.
concurrency:
  group: process-reports
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python worker.py
