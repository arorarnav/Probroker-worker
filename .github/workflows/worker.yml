name: Process Reports

on:
  # Schedule is PAUSED during the manual/concierge launch phase -- you're
  # processing reports by hand right now, and having this fire every 10
  # minutes would race against you (and fail them, since the model isn't
  # switched over yet). Uncomment the schedule below once you're ready to
  # switch back to full automation (e.g. once you cross ~100 users).
  #
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch:          # still lets you trigger it manually to test, any time

# Prevents a second run from starting while an earlier one is still working
# through reports.
concurrency:
  group: process-reports
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python worker.py
